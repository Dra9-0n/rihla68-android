
name: Build Rihla 68 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip -q "rihla68_android_v1_1_development.zip" -d extracted
          test -f extracted/rihla68_android/app/build.gradle

      - name: Build APK
        run: gradle -p extracted/rihla68_android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rihla68-Android-APK
          path: extracted/rihla68_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
